# Co-PiLOT base configuration.
# All experimental knobs live here. Override on the CLI:
#   python scripts/run_experiment.py --config config/base.yaml \
#       --override decoder.name=fmdit optimizer.name=dante objective.name=v1

experiment:
  name: "az31_default"
  seed: 42
  output_dir: "results"
  device: "cuda"          # "cuda" | "cpu"

# ----------------------------------------------------------------------------
# Latent space (the optimization variable)
# ----------------------------------------------------------------------------
latent:
  dim: 512
  bounds: [-3.0, 3.0]                 # symmetric box; per-dim
  use_box_constraint: true            # hard clamp on z (always recommended)
  use_physics_penalty: false          # soft penalty on degenerate decodes
  physics_penalty:
    min_pixel_std: 5.0                # decoded image grayscale std-dev floor
    weight: 10.0                      # subtracted from objective value
  init:
    mode: "from_class"                # "sobol" | "from_npy" | "encode_images" | "from_class"
    n_seed: 50                        # initial design size (paper uses ~200)
    npy_path: null                    # required if mode=from_npy
    images_dir: null                  # required if mode=encode_images
    encoder_ckpt: null                # required if mode=encode_images
    seeds_dir: "assets/latent_seeds"  # required if mode=from_class; holds {class_key}.npy
    class_key: null                   # defaults to codec.class_key if null

# ----------------------------------------------------------------------------
# Decoder selection (z -> 512x512 RGB PNG)
# ----------------------------------------------------------------------------
decoder:
  name: "mock"                        # "fmdit" | "vitdit" | "sdxl" | "mock"
  num_inference_steps: 50
  image_size: 512

  # Per-decoder checkpoint paths. Filled in once pretraining is complete.
  fmdit:
    checkpoint: null                  # path to FM-DiT adapter .pth
    sd35_model_id: "stabilityai/stable-diffusion-3.5-medium"
  vitdit:
    checkpoint: null
    sd_vae_model_id: "stabilityai/sd-vae-ft-mse"
  sdxl:
    checkpoint: null
    sdxl_model_id: "stabilityai/stable-diffusion-xl-base-1.0"
  mock:
    seed_offset: 0                    # for reproducible mock images

# ----------------------------------------------------------------------------
# Orientation codec (PNG -> Dream3D)
# ----------------------------------------------------------------------------
codec:
  class_means_json: null              # MUST be supplied; per-class anchor quaternions
  class_key: "AZ31_extruded"          # which class entry in class_means.json to use
  # Grain-morphology strategy:
  #   template_dream3d: null → segmentation-based (DEFAULT, recommended).
  #     Recovers grain morphology from the decoded image itself, preserving
  #     the decoder's grain sizes and aspect ratios.
  #   template_dream3d: "path/to/file.dream3d" → template-based (legacy).
  #     Copies the template and overwrites only EulerAngles. Grain morphology
  #     is FIXED to the template's FeatureIds. Use only when the decoder is
  #     guaranteed to produce the same grain structure as the template.
  template_dream3d: null
  colour_tol: null                    # auto; raise (e.g. 5) for noisy generators
  spacing: [2.0, 2.0, 2.0]            # voxel spacing [X, Y, Z] in µm (300x300 @ 2µm = 600µm domain, matches AZ31_extruded RVEs)
  min_grains: null                    # int|null; reject RVEs with fewer grains (representativeness floor)
  min_pixel_std: null                 # float|null; reject decoded PNGs whose mean per-channel pixel std is below this (blank / blob regime)
  target_size: 300                    # int|null; NEAREST-downsample input PNG to (target_size, target_size) before decode (matches seed-cache 300x300 pipeline)

# ----------------------------------------------------------------------------
# DAMASK simulation
# ----------------------------------------------------------------------------
simulation:
  load_yaml: "simulations/load.yaml"
  phase_yaml: "simulations/AZ31_Phenopower.yaml"
  geometries_dir: "simulations/Geometries"  # optional; not needed with segmentation mode
  target_phase: "AZ31"
  target_homog: "SX"
  damask_binary: "DAMASK_grid"
  n_threads: 8
  loading_direction: "x"
  cleanup_hdf5: true
  fail_on_simulation_error: false     # if false, returns None and loop skips
  timeout_seconds: 7200

# Property extraction (Hollomon)
extraction:
  youngs_strain_max: 0.001
  yield_tolerance: 0.4

# ----------------------------------------------------------------------------
# Objective function
# ----------------------------------------------------------------------------
objective:
  name: "v1"                          # "v1" | "v2"

  # V1: Toughness-weighted scalar objective
  v1:
    sigma_y_ref: 250.0                # MPa
    toughness_ref: 50.0               # MPa·strain (sigma_u * eps_uniform proxy)
    alpha: 1.0
    beta: 1.0
    n_min: 0.10                       # ductility floor; below -> linear penalty
    lambda_n: 5.0
    g_min: 0                          # representativeness floor (0 -> disabled)
    lambda_g: 0.0                     # penalty weight for under-resolved RVEs
    g_max: 0                          # upper grain band (0 -> disabled); >g_max grains => speckle-regime penalty
    lambda_g_hi: 0.0                  # penalty weight for upper-band violations

  # V2R: Target-driven distance objective (codec-reachable retune)
  v2:
    targets:                          # in same units as the extractor outputs
      sigma_y: 280.0                  # MPa
      n: 0.22
      K: 480.0                        # MPa
      sigma_u: 380.0                  # MPa
    weights:
      sigma_y: 1.0
      n: 50.0                         # n is small in magnitude -> upweight
      K: 0.5
      sigma_u: 1.0
    g_min: 0                          # representativeness floor (0 -> disabled)
    lambda_g: 0.0                     # penalty weight for under-resolved RVEs
    g_max: 0                          # upper grain band (0 -> disabled); >g_max grains => speckle-regime penalty
    lambda_g_hi: 0.0                  # penalty weight for upper-band violations

# ----------------------------------------------------------------------------
# Optimizer selection
# ----------------------------------------------------------------------------
optimizer:
  name: "dante"                       # "dante" | "turbo" | "baxus" | "meridian"
  batch_size: 5                       # candidates evaluated per iteration

  dante:
    surrogate_hidden: [1024, 512, 256]
    surrogate_lr: 1.0e-3
    surrogate_epochs: 200
    surrogate_batch_size: 32
    surrogate_dropout: 0.1
    surrogate_weight_decay: 1.0e-4
    val_split: 0.1
    early_stop_patience: 20
    # NTE
    n_rollouts: 200
    n_leaves_per_expand: 16
    sigma_init: 0.5
    sigma_decay: 0.99
    c0: 0.1
    rho_smoothing: 0.5                # EMA factor for c(rho)

  turbo:
    n_init: 0                         # use latent.init.n_seed
    length_init: 0.8
    length_min: 0.5e-2
    length_max: 1.6
    success_tolerance: 3
    failure_tolerance_factor: 1.5     # tau_fail = ceil(d / batch * factor)
    acquisition: "ts"                 # "ts" | "ei"
    n_candidates: 5000

  baxus:
    initial_target_dim: 10
    n_init: 0                         # use latent.init.n_seed
    length_init: 0.8
    length_min: 0.5e-2
    length_max: 1.6
    success_tolerance: 3
    failure_tolerance_factor: 1.5
    acquisition: "ts"

  # MERIDIAN — DKL surrogate + active-subspace trust region + DPP batches.
  # See theory.md §7 for the algorithmic justification.
  meridian:
    # Surrogate (DKL: small MLP feature extractor → exact GP head)
    feature_hidden: [512, 128]
    feature_dim: 16
    surrogate_lr: 1.0e-3
    surrogate_epochs: 200
    surrogate_weight_decay: 1.0e-4
    # Subspace (PCA warm-start → active-subspace from surrogate gradients)
    subspace_energy: 0.95             # cumulative spectral energy threshold
    subspace_k_min: 8
    subspace_k_max: 24
    pca_warmstart_rounds: 3           # use PCA basis until this many rounds done
    # Trust region (TuRBO-style cadence in subspace coords)
    L_init: 0.8
    L_min: 0.5e-2
    L_max: 1.6
    success_tolerance: 3
    failure_tolerance_factor: 1.0     # tau_fail = ceil(k / batch * factor)
    max_restarts: 3                   # stop after this many trust-region collapses
    # Acquisition + batch
    sobol_cloud: 4096                 # candidate pool inside the trust region
    dpp_pool: 256                     # top-k acquisition pool fed to greedy-DPP
    # Manifold-tangent trust region (MERIDIAN-specific): after lifting Sobol
    # candidates and clipping to the latent box, project candidates radially
    # onto the encoded-real shell window [shell_radius_min, shell_radius_max].
    # Set both to 0.0 to disable (recovers vanilla MERIDIAN). Typical values
    # come from the seed-cache ||z|| stats:
    #   FM-DiT  shell ≈ 22.07 ± 0.05 → use [22.00, 22.20]
    #   ViT-DiT shell ≈ 22.63 ± 0.06 → use [22.50, 22.80]
    shell_radius_min: 0.0             # float; 0 disables shell projection
    shell_radius_max: 0.0             # float; 0 disables shell projection

# ----------------------------------------------------------------------------
# Outer loop
# ----------------------------------------------------------------------------
loop:
  n_iterations: 30
  checkpoint_every: 5
  log_every: 1
  dry_run: false                      # if true, replaces DAMASK with a mock function
  seed_cache: null                    # path to seed_cache.npz from precompute_seeds.py
  resume_checkpoint: null             # path to state_iterNNNN.npz to resume a crashed run
  # Optional pre-filter on the warm-start seed cache. When enabled, drops
  # seed entries whose decoded RVE has n_grains outside [keep_g_min,
  # keep_g_max] before feeding them to the surrogate. Disabled by default;
  # per-cell configs enable it with class-tuned bounds.
  cache_filter:
    enabled: false
    keep_g_min: 1
    keep_g_max: 100000

# ----------------------------------------------------------------------------
# Ablation harness
# ----------------------------------------------------------------------------
ablation:
  decoders: ["fmdit", "vitdit", "sdxl"]
  optimizers: ["dante", "turbo", "baxus"]
  objectives: ["v1", "v2"]
  n_repeats: 1
